<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 290" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5F5E5A"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#185FA5"/></marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3B6D11"/></marker>
    <marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#B4B2A9"/></marker>
  </defs>
  <rect width="1000" height="290" fill="#FFFFFF"/>

  <!-- dashed skipped path -->
  <path d="M90,84 L90,250 L652,250 L652,60 L672,60" fill="none" stroke="#B4B2A9" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#ad)"/>
  <text x="370" y="270" text-anchor="middle" font-size="13" font-style="italic" fill="#888780">Target prefill (skipped)</text>

  <!-- Prompt -->
  <rect x="30" y="40" width="120" height="44" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1.2"/>
  <text x="90" y="67" text-anchor="middle" font-size="15" fill="#2C2C2A">Prompt</text>
  <line x1="150" y1="62" x2="196" y2="62" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ag)"/>

  <!-- Source model -->
  <rect x="200" y="32" width="180" height="60" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.4"/>
  <text x="290" y="57" text-anchor="middle" font-size="15" font-weight="600" fill="#0C447C">Source model</text>
  <text x="290" y="77" text-anchor="middle" font-size="13" fill="#185FA5">(e.g. Qwen3-14B)</text>
  <line x1="290" y1="92" x2="290" y2="136" stroke="#185FA5" stroke-width="1.6" marker-end="url(#ab)"/>
  <text x="300" y="119" font-size="13" fill="#185FA5">Prefill</text>

  <!-- Source KV -->
  <rect x="200" y="140" width="180" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.4"/>
  <text x="290" y="164" text-anchor="middle" font-size="14" fill="#0C447C">Source</text>
  <text x="290" y="183" text-anchor="middle" font-size="14" fill="#0C447C">KV cache</text>
  <line x1="380" y1="168" x2="426" y2="168" stroke="#185FA5" stroke-width="1.6" marker-end="url(#ab)"/>

  <!-- Mapper -->
  <rect x="430" y="140" width="190" height="56" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="2"/>
  <text x="525" y="174" text-anchor="middle" font-size="16" font-weight="600" fill="#854F0B">Linear mapper</text>
  <text x="525" y="216" text-anchor="middle" font-size="12.5" fill="#444441">One ridge regression per head</text>
  <text x="525" y="233" text-anchor="middle" font-size="12.5" fill="#444441">(no training, about 1 hour on 8×H100)</text>
  <line x1="620" y1="168" x2="676" y2="168" stroke="#3B6D11" stroke-width="1.6" marker-end="url(#agr)"/>

  <!-- Mapped KV -->
  <rect x="680" y="140" width="180" height="56" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1.4"/>
  <text x="770" y="164" text-anchor="middle" font-size="14" fill="#27500A">Mapped</text>
  <text x="770" y="183" text-anchor="middle" font-size="14" fill="#27500A">KV cache</text>
  <line x1="770" y1="140" x2="770" y2="96" stroke="#3B6D11" stroke-width="1.6" marker-end="url(#agr)"/>
  <text x="780" y="123" font-size="13" fill="#3B6D11">Decode (no prefill)</text>

  <!-- Target model -->
  <rect x="680" y="32" width="180" height="60" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1.4"/>
  <text x="770" y="57" text-anchor="middle" font-size="15" font-weight="600" fill="#27500A">Target model</text>
  <text x="770" y="77" text-anchor="middle" font-size="13" fill="#3B6D11">(e.g. Qwen3-32B)</text>
  <line x1="860" y1="62" x2="886" y2="62" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ag)"/>

  <!-- Generation -->
  <rect x="890" y="40" width="100" height="44" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1.2"/>
  <text x="940" y="67" text-anchor="middle" font-size="14" fill="#2C2C2A">Generation</text>
</svg>
