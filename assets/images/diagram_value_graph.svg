= a * b</text><text class="ts" x="355" y="190" text-anchor="middle" dominant-baseline="central">data = 6.0</text><text class="ts" x="355" y="208" text-anchor="middle" dominant-baseline="central">grad = 1.0</text></g><g class="te"><rect x="520" y="60" width="130" height="72" rx="8" stroke-width="0.75"/><text class="th" x="585" y="80" text-anchor="middle" dominant-baseline="central">L = c + a</text><text class="ts" x="585" y="100" text-anchor="middle" dominant-baseline="central">data = 8.0</text><text class="ts" x="585" y="118" text-anchor="middle" dominant-baseline="central">grad = 1.0</text></g><text class="ts" x="340" y="312" text-anchor="middle" dominant-baseline="central">a reaches L by two roads: directly (1) and through c (3 x 1 = 3). Total a.grad = 1 + 3 = 4.</text></svg>
