<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 280" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#888780"/></marker></defs>
<rect width="700" height="280" fill="#FFFFFF"/>
<text x="20" y="28" font-size="15" font-weight="600" fill="#2C2C2A">Calibration: once per model pair, offline, about 1 hour</text>
<rect x="20" y="45" width="150" height="58" rx="9" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.3"/>
<text x="95.0" y="70" text-anchor="middle" font-size="15" font-weight="600" fill="#3C3489">Sample texts</text>
<text x="95.0" y="90" text-anchor="middle" font-size="12.5" fill="#534AB7">500 × 1,024 tokens</text>
<line x1="170" y1="74" x2="187" y2="74" stroke="#888780" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="190" y="45" width="150" height="58" rx="9" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.3"/>
<text x="265.0" y="70" text-anchor="middle" font-size="15" font-weight="600" fill="#3C3489">Run both models</text>
<text x="265.0" y="90" text-anchor="middle" font-size="12.5" fill="#534AB7">8B and 32B</text>
<line x1="340" y1="74" x2="357" y2="74" stroke="#888780" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="360" y="45" width="150" height="58" rx="9" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.3"/>
<text x="435.0" y="70" text-anchor="middle" font-size="15" font-weight="600" fill="#3C3489">Pair up K/V</text>
<text x="435.0" y="90" text-anchor="middle" font-size="12.5" fill="#534AB7">128K examples</text>
<line x1="510" y1="74" x2="527" y2="74" stroke="#888780" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="530" y="45" width="150" height="58" rx="9" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.3"/>
<text x="605.0" y="70" text-anchor="middle" font-size="15" font-weight="600" fill="#3C3489">Solve ridge</text>
<text x="605.0" y="90" text-anchor="middle" font-size="12.5" fill="#534AB7">get W and b</text>
<text x="20" y="178" font-size="15" font-weight="600" fill="#2C2C2A">Use: at every handoff, live</text>
<rect x="20" y="195" width="150" height="58" rx="9" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.3"/>
<text x="95.0" y="220" text-anchor="middle" font-size="15" font-weight="600" fill="#085041">New chat</text>
<text x="95.0" y="240" text-anchor="middle" font-size="12.5" fill="#0F6E56">any text, any length</text>
<line x1="170" y1="224" x2="187" y2="224" stroke="#888780" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="190" y="195" width="150" height="58" rx="9" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.3"/>
<text x="265.0" y="220" text-anchor="middle" font-size="15" font-weight="600" fill="#085041">Small model</text>
<text x="265.0" y="240" text-anchor="middle" font-size="12.5" fill="#0F6E56">normal prefill</text>
<line x1="340" y1="224" x2="357" y2="224" stroke="#888780" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="360" y="195" width="150" height="58" rx="9" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.3"/>
<text x="435.0" y="220" text-anchor="middle" font-size="15" font-weight="600" fill="#085041">Apply W</text>
<text x="435.0" y="240" text-anchor="middle" font-size="12.5" fill="#0F6E56">convert cache</text>
<line x1="510" y1="224" x2="527" y2="224" stroke="#888780" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="530" y="195" width="150" height="58" rx="9" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.3"/>
<text x="605.0" y="220" text-anchor="middle" font-size="15" font-weight="600" fill="#085041">Big model</text>
<text x="605.0" y="240" text-anchor="middle" font-size="12.5" fill="#0F6E56">skips prefill</text>
<path d="M605,103 L605,150 L435,150 L435,191" fill="none" stroke="#888780" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="596" y="133" text-anchor="end" font-size="12.5" fill="#5F5E5A">saved W, reused</text>
</svg>