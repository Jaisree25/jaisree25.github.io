.am rect{fill:#633806;stroke:#EF9F27}.am .th{fill:#FAEEDA}.am .ts{fill:#FAC775}
.co rect{fill:#712B13;stroke:#F0997B}.co .th{fill:#FAECE7}.co .ts{fill:#F5C4B3}
.gr rect,.gr circle{fill:#444441;stroke:#B4B2A9}.gr .th{fill:#F1EFE8}.gr .ts{fill:#D3D1C7}
.dash{stroke:#5F5E5A}.bg{fill:#1f1e1d}
}
</style>
