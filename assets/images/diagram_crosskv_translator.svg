<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 488" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#888780"/></marker></defs>
<rect width="360" height="488" fill="#FFFFFF"/>
<rect x="30" y="15" width="300" height="58" rx="9" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.3"/>
<text x="180" y="40" text-anchor="middle" font-size="15" font-weight="600" fill="#085041">Small model's KV cache</text>
<text x="180" y="60" text-anchor="middle" font-size="12.5" fill="#0F6E56">already computed, nothing new to run</text>
<line x1="180" y1="73" x2="180" y2="93" stroke="#888780" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="30" y="95" width="300" height="58" rx="9" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.3"/>
<text x="180" y="120" text-anchor="middle" font-size="15" font-weight="600" fill="#3C3489">1. Pick the best k layers</text>
<text x="180" y="140" text-anchor="middle" font-size="12.5" fill="#534AB7">glue all their heads together</text>
<line x1="180" y1="153" x2="180" y2="173" stroke="#888780" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="30" y="175" width="300" height="58" rx="9" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.3"/>
<text x="180" y="200" text-anchor="middle" font-size="15" font-weight="600" fill="#3C3489">2. Un-spin the keys</text>
<text x="180" y="220" text-anchor="middle" font-size="12.5" fill="#534AB7">remove RoPE, keep pure content</text>
<line x1="180" y1="233" x2="180" y2="253" stroke="#888780" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="30" y="255" width="300" height="58" rx="9" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.3"/>
<text x="180" y="280" text-anchor="middle" font-size="15" font-weight="600" fill="#3C3489">3. Multiply by W, add b</text>
<text x="180" y="300" text-anchor="middle" font-size="12.5" fill="#534AB7">W found by ridge regression</text>
<line x1="180" y1="313" x2="180" y2="333" stroke="#888780" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="30" y="335" width="300" height="58" rx="9" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.3"/>
<text x="180" y="360" text-anchor="middle" font-size="15" font-weight="600" fill="#3C3489">4. Re-spin the keys</text>
<text x="180" y="380" text-anchor="middle" font-size="12.5" fill="#534AB7">put RoPE back for each position</text>
<line x1="180" y1="393" x2="180" y2="413" stroke="#888780" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="30" y="415" width="300" height="58" rx="9" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.3"/>
<text x="180" y="440" text-anchor="middle" font-size="15" font-weight="600" fill="#085041">One K/V head of the big model</text>
<text x="180" y="460" text-anchor="middle" font-size="12.5" fill="#0F6E56">repeat for every layer and head</text>
</svg>