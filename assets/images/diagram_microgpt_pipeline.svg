<svg xmlns="http://www.w3.org/2000/svg" width="680" height="264" viewBox="0 0 680 264" role="img"><title>microgpt training pipeline</title><style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.t{font-size:14px;fill:#1f1e1d}.th{font-size:14px;font-weight:600;fill:#1f1e1d}.ts{font-size:12px;fill:#5f5e5a}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.ln{stroke:#888780;fill:none}.hot{stroke:#D85A30;fill:none}.amb{stroke:#EF9F27}
.pu rect,.pu circle{fill:#EEEDFE;stroke:#534AB7}.pu .th{fill:#3C3489}.pu .ts{fill:#534AB7}
.te rect,.te circle{fill:#E1F5EE;stroke:#0F6E56}.te .th{fill:#085041}.te .ts{fill:#0F6E56}
.am rect{fill:#FAEEDA;stroke:#BA7517}.am .th{fill:#633806}.am .ts{fill:#854F0B}
.co rect{fill:#FAECE7;stroke:#993C1D}.co .th{fill:#712B13}.co .ts{fill:#993C1D}
.gr rect,.gr circle{fill:#F1EFE8;stroke:#888780}.gr .th{fill:#444441}.gr .ts{fill:#5F5E5A}
.dash{fill:none;stroke:#B4B2A9;stroke-dasharray:4 4}.bg{fill:#ffffff}
@media (prefers-color-scheme:dark){
.t,.th{fill:#ecebe6}.ts{fill:#b4b2a9}
.pu rect,.pu circle{fill:#3C3489;stroke:#AFA9EC}.pu .th{fill:#EEEDFE}.pu .ts{fill:#CECBF6}
.te rect,.te circle{fill:#085041;stroke:#5DCAA5}.te .th{fill:#E1F5EE}.te .ts{fill:#9FE1CB}
.am rect{fill:#633806;stroke:#EF9F27}.am .th{fill:#FAEEDA}.am .ts{fill:#FAC775}
.co rect{fill:#712B13;stroke:#F0997B}.co .th{fill:#FAECE7}.co .ts{fill:#F5C4B3}
.gr rect,.gr circle{fill:#444441;stroke:#B4B2A9}.gr .th{fill:#F1EFE8}.gr .ts{fill:#D3D1C7}
.dash{stroke:#5F5E5A}.bg{fill:#1f1e1d}
}
</style>
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect class="bg" width="680" height="264" rx="12"/><g class="pu"><rect x="20" y="30" width="145" height="56" rx="8" stroke-width="0.75"/><text class="th" x="92.5" y="49.0" text-anchor="middle" dominant-baseline="central">Dataset</text><text class="ts" x="92.5" y="68.0" text-anchor="middle" dominant-baseline="central">32,033 names</text></g><g class="pu"><rect x="185" y="30" width="145" height="56" rx="8" stroke-width="0.75"/><text class="th" x="257.5" y="49.0" text-anchor="middle" dominant-baseline="central">Tokenizer</text><text class="ts" x="257.5" y="68.0" text-anchor="middle" dominant-baseline="central">27 tokens</text></g><g class="pu"><rect x="350" y="30" width="145" height="56" rx="8" stroke-width="0.75"/><text class="th" x="422.5" y="49.0" text-anchor="middle" dominant-baseline="central">GPT model</text><text class="ts" x="422.5" y="68.0" text-anchor="middle" dominant-baseline="central">4,192 parameters</text></g><g class="co"><rect x="515" y="30" width="145" height="56" rx="8" stroke-width="0.75"/><text class="th" x="587.5" y="49.0" text-anchor="middle" dominant-baseline="central">Loss</text><text class="ts" x="587.5" y="68.0" text-anchor="middle" dominant-baseline="central">cross-entropy</text></g><line class="ln" x1="165" y1="58" x2="181" y2="58" stroke-width="1.2" marker-end="url(#ar)"/><line class="ln" x1="330" y1="58" x2="346" y2="58" stroke-width="1.2" marker-end="url(#ar)"/><line class="ln" x1="495" y1="58" x2="511" y2="58" stroke-width="1.2" marker-end="url(#ar)"/><g class="te"><rect x="515" y="150" width="145" height="56" rx="8" stroke-width="0.75"/><text class="th" x="587.5" y="169.0" text-anchor="middle" dominant-baseline="central">loss.backward()</text><text class="ts" x="587.5" y="188.0" text-anchor="middle" dominant-baseline="central">a gradient per param</text></g><g class="te"><rect x="350" y="150" width="145" height="56" rx="8" stroke-width="0.75"/><text class="th" x="422.5" y="169.0" text-anchor="middle" dominant-baseline="central">Adam</text><text class="ts" x="422.5" y="188.0" text-anchor="middle" dominant-baseline="central">nudge every param</text></g><line class="ln" x1="587" y1="86" x2="587" y2="146" stroke-width="1.2" marker-end="url(#ar)"/><line class="ln" x1="515" y1="178" x2="499" y2="178" stroke-width="1.2" marker-end="url(#ar)"/><line class="ln" x1="422" y1="150" x2="422" y2="90" stroke-width="1.2" marker-end="url(#ar)"/><text class="ts" x="340" y="240" text-anchor="middle" dominant-baseline="central">Repeat for 1,000 steps, one name per step. Then sample new names from the trained model.</text></svg>
